[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notice-solver"
version = "0.1.0"
description = "호서대학교 공지사항 수집 및 지식 베이스 구축 CLI 도구"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "easyocr>=1.7",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "ghapi>=1.0",
    "python-frontmatter>=1.1",
    "typer[all]>=0.12",
    "pydantic-settings>=2.3",
    "tenacity>=8.3",
    "markdownify>=0.13",
]

[project.scripts]
notice-solver = "notice_solver.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/notice_solver"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.envs.default]
installer = "uv"
