name: Phase 2.5 - OCR 배치 처리

on:
  schedule:
    - cron: '0 17 * * *'   # UTC 17:00 = KST 02:00 매일 (Phase 1·2 완료 후)
  workflow_dispatch:
    inputs:
      limit:
        description: '처리할 최대 자산 수'
        default: '50'
      type:
        description: '자산 유형 필터'
        type: choice
        options:
          - all
          - image
          - attachment
        default: all
      retry_failed:
        description: 'status:ocr-failed 자산 재시도'
        type: boolean
        default: false

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # EasyOCR CPU 처리 여유 시간

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'

      # HWP 변환용 LibreOffice (첨부 파일 처리 시 필요)
      - name: LibreOffice 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libreoffice --no-install-recommends

      # EasyOCR 모델 캐싱 (~1GB, 최초 1회만 다운로드)
      - name: EasyOCR 모델 캐시 복원
        id: easyocr-cache
        uses: actions/cache@v4
        with:
          path: ~/.EasyOCR
          key: easyocr-models-ko-en-v1
          restore-keys: |
            easyocr-models-

      - name: 의존성 설치
        run: uv sync

      - name: 인덱스 캐시 복원
        uses: actions/cache@v4
        with:
          path: .cache/
          key: notice-cache-${{ github.run_id }}
          restore-keys: notice-cache-

      - name: OCR 배치 실행
        env:
          GITHUB_TOKEN: ${{ secrets.NOTICE_SOLVER_TOKEN }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
        run: |
          ARGS="--limit ${{ inputs.limit || '50' }} --type ${{ inputs.type || 'all' }}"
          if [ "${{ inputs.retry_failed }}" = "true" ]; then
            ARGS="$ARGS --retry-failed"
          fi
          uv run notice-solver ocr run $ARGS

      # EasyOCR 모델 캐시 저장 (최초 다운로드 후)
      - name: EasyOCR 모델 캐시 저장
        if: steps.easyocr-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.EasyOCR
          key: easyocr-models-ko-en-v1
