name: Phase 1 - 공지 수집

on:
  schedule:
    - cron: '0 16 * * *'   # UTC 16:00 = KST 01:00 매일
  workflow_dispatch:
    inputs:
      full:
        description: '전체 재수집 (기본: 증분)'
        type: boolean
        default: false
      limit:
        description: '최대 수집 건수 (0=무제한)'
        default: '0'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: uv sync

      - name: GitHub 레이블 초기화 (최초 1회, 이후 멱등)
        env:
          GITHUB_TOKEN: ${{ secrets.NOTICE_SOLVER_TOKEN }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
        run: uv run notice-solver init-labels

      - name: 공지 수집
        env:
          GITHUB_TOKEN: ${{ secrets.NOTICE_SOLVER_TOKEN }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
        run: |
          ARGS=""
          if [ "${{ inputs.full }}" = "true" ]; then
            ARGS="$ARGS --full"
          fi
          if [ "${{ inputs.limit }}" != "0" ] && [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          uv run notice-solver collect $ARGS

      - name: 수집 결과 캐시 저장
        uses: actions/cache@v4
        with:
          path: .cache/
          key: notice-cache-${{ github.run_id }}
          restore-keys: notice-cache-
